<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Case Math · Mental math for case interviews</title>
<meta name="theme-color" content="#E30613">
<meta name="description" content="Entrenador de cálculo mental para case interviews: niveles adaptativos, reto diario y ranking.">
<meta name="google-site-verification" content="08JqPUdTKymTPnwGIJn02uYIwJA0QDCPW0DF2SV38eQ" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Case Math">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --red:#E30613; --red-d:#c50511; --ink:#1A1A1A; --muted:#6B6B6B; --hairline:#E6E6E6;
    --box-red:#FDECEC; --box-gray:#F4F4F4; --graphite:#333; --ok:#1B8A3A; --paper:#fff; --bg:#F5F5F5;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.06); --radius:12px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Helvetica Neue",sans-serif;
    --navh:60px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font); color:var(--ink); background:var(--bg); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
    min-height:100vh; min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  button{font-family:var(--font)}
  .kicker{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--red);font-weight:800}
  .muted{color:var(--muted)}
  .hidden{display:none !important}

  /* Header (no fijo) */
  header.app{background:var(--paper);border-bottom:3px solid var(--red)}
  .bar{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .bar .mark{width:30px;height:30px;border-radius:7px;background:var(--red);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
  .bar h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.01em;white-space:nowrap}
  .bar .sub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .bar .spacer{flex:1}
  .rankchip{display:flex;align-items:center;gap:7px;border:1px solid var(--hairline);border-radius:100px;padding:4px 10px 4px 6px;background:var(--paper);cursor:pointer;min-width:0}
  .rankchip .ic{font-size:16px}
  .rankchip .rt{display:block;font-size:11px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
  .rankchip .rx{display:block;font-size:9.5px;color:var(--muted);line-height:1;margin-top:2px;white-space:nowrap}
  .gear{border:1px solid var(--hairline);background:var(--paper);width:36px;height:36px;border-radius:9px;font-size:17px;cursor:pointer;color:var(--ink);flex:none}
  .gear:active{background:var(--box-gray)}

  main{flex:1;max-width:680px;width:100%;margin:0 auto;padding:16px 16px calc(var(--navh) + 130px + env(safe-area-inset-bottom));min-height:0}

  /* Bottom nav */
  nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--hairline);
    display:flex;justify-content:center;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.04)}
  nav.tabbar .t{flex:1;max-width:150px;border:none;background:transparent;color:var(--muted);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:10px;font-size:10.5px;font-weight:700}
  nav.tabbar .t .i{font-size:19px;line-height:1}
  nav.tabbar .t.on{color:var(--red)}
  nav.tabbar .t.on .i{transform:translateY(-1px)}

  /* Cards & buttons */
  .card{background:var(--paper);border:1px solid var(--hairline);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .card>.kicker{display:block;margin-bottom:10px}
  .sechead{display:flex;align-items:flex-end;gap:12px;margin:2px 0 14px}
  .sechead h2{font-size:20px;margin:0}
  .sechead .rule{height:3px;width:34px;background:var(--red);margin:0 0 6px}
  .btn{border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:800;padding:11px 16px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
  .btn.red{background:var(--red);color:#fff}
  .btn.red:active{background:var(--red-d)}
  .btn.ghost{background:var(--paper);border:1px solid var(--hairline);color:var(--ink)}
  .btn.ghost:active{background:var(--box-gray)}
  .btn.block{width:100%}
  .btn:disabled{opacity:.5}
  .row{display:flex;gap:10px;flex-wrap:wrap}

  /* segmented toggle */
  .seg{display:flex;background:var(--box-gray);border:1px solid var(--hairline);border-radius:11px;padding:3px;gap:3px;margin-bottom:14px}
  .seg button{flex:1;border:none;background:transparent;padding:9px 6px;border-radius:8px;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--paper);color:var(--red);box-shadow:var(--shadow)}

  /* HUD (train) */
  .hud{display:flex;gap:10px;margin-bottom:12px}
  .hud .c{flex:1;background:var(--paper);border:1px solid var(--hairline);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow)}
  .hud .lab{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:800}
  .hud .val{font-size:19px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
  .hud .val small{font-size:11px;color:var(--muted);font-weight:700}
  .lvlbar{height:7px;border-radius:99px;background:var(--box-gray);overflow:hidden;margin-top:8px}
  .lvlbar>span{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .35s}
  .pips{display:flex;gap:6px;margin-top:9px}
  .pip{flex:1;height:6px;border-radius:99px;background:var(--box-gray)}
  .pip.on{background:var(--red)}
  /* medidor de rendimiento reciente (subir/bajar de nivel) */
  .perfmeter{position:relative;height:13px;border-radius:99px;background:var(--box-gray);border:1px solid var(--hairline)}
  .perf-fill{height:100%;border-radius:99px;background:var(--red);width:0;transition:width .35s,background .3s}
  .perf-fill.danger{background:var(--graphite)}
  .perf-tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--graphite);opacity:.65}
  .pip.warn{background:#f0b4b8}

  /* Play area */
  .play{text-align:center}
  .timerbar{height:8px;border-radius:99px;background:var(--box-gray);overflow:hidden;margin:2px 0 16px}
  .timerbar>span{display:block;height:100%;width:0;background:var(--red);border-radius:99px}
  .combo{font-size:13px;font-weight:800;color:var(--red);min-height:18px;letter-spacing:.02em}
  .problem{font-weight:800;letter-spacing:.01em;font-variant-numeric:tabular-nums;color:var(--ink);
    font-size:clamp(30px,10vw,52px);line-height:1.1;margin:6px 0 4px;word-break:break-word}
  .tag-est{font-size:11px;font-weight:800;color:var(--red);background:var(--box-red);border:1px solid #f6d5d7;border-radius:99px;padding:2px 9px;display:inline-block;margin-bottom:4px}
  .answer{margin:12px auto 0;min-height:56px;max-width:320px;border:2px solid var(--hairline);border-radius:12px;background:var(--paper);
    font-size:30px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;padding:6px 14px}
  .answer.empty{color:#B9B9B9;font-weight:600;font-size:17px}
  .feedback{min-height:22px;margin:12px 0 4px;font-size:13.5px;font-weight:800;text-underline-offset:4px;text-decoration-thickness:2px}
  .feedback.ok{color:var(--ok);text-decoration:underline}
  .feedback.bad{color:var(--red);text-decoration:underline}

  /* Keypad */
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:340px;margin:14px auto 0}
  .key{border:1px solid var(--hairline);background:var(--paper);border-radius:13px;font-size:24px;font-weight:800;color:var(--ink);
    padding:15px 0;cursor:pointer;font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none}
  .key:active{background:var(--box-gray);transform:scale(.97)}
  .key.del{color:var(--graphite);font-size:20px}
  .key.ok{background:var(--red);color:#fff;border-color:var(--red)}
  .key.ok:active{background:var(--red-d)}
  .miniact{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .miniact button{border:1px solid var(--hairline);background:var(--paper);border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
  .miniact button:active{background:var(--box-gray)}

  /* chips config (libre) */
  .side{background:var(--box-gray);border:1px solid var(--hairline);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
  .side h3{font-size:14px;margin:0 0 2px}
  .sublabel{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:11px 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--hairline);background:var(--paper);color:var(--ink);min-width:42px;padding:8px 11px;border-radius:9px;font-size:14px;font-weight:800;cursor:pointer;text-align:center}
  .chip.on{background:var(--red);color:#fff;border-color:var(--red)}

  /* ranking */
  .lb{width:100%;border-collapse:collapse;font-size:14px}
  .lb th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;text-align:left;padding:6px 8px;border-bottom:1px solid var(--hairline)}
  .lb td{padding:9px 8px;border-bottom:1px solid var(--hairline);font-variant-numeric:tabular-nums}
  .lb td.pos{width:34px;font-weight:800;color:var(--muted)}
  .lb tr.me td{background:var(--box-red)}
  .lb tr.me td.pos{color:var(--red)}
  .lb .sec{display:inline-block;font-size:11px;font-weight:800;color:var(--muted);border:1px solid var(--hairline);border-radius:99px;padding:1px 7px;margin-left:6px}
  .medal{font-size:15px}
  .filterbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .filterbar button{border:1px solid var(--hairline);background:var(--paper);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer}
  .filterbar button.on{background:var(--red);color:#fff;border-color:var(--red)}
  /* challenge hero */
  .chero{background:linear-gradient(160deg,#fff 0%,var(--box-red) 100%);border:1px solid #f4d3d6;border-top:4px solid var(--red);border-radius:16px;padding:22px 18px 20px;text-align:center;box-shadow:var(--shadow);margin-bottom:14px}
  .chero-badge{width:60px;height:60px;border-radius:16px;background:var(--red);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 6px 16px rgba(227,6,19,.28)}
  .chero-kick{font-size:22px;font-weight:800;letter-spacing:.01em}
  .chero-date{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:800;margin-top:3px}
  .chero-best{font-size:13px;color:var(--graphite);margin-top:10px}
  .chero-best b{color:var(--red);font-size:15px}
  .chero-how{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.45}

  /* strategies */
  .strat{border:1px solid var(--hairline);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;background:var(--paper)}
  .strat>summary{cursor:pointer;padding:12px 14px;font-weight:800;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px;background:var(--box-gray)}
  .strat>summary::-webkit-details-marker{display:none}
  .strat>summary .stag{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--red);padding:3px 8px;border-radius:99px;margin-left:auto}
  .strat .body{padding:13px 14px;font-size:13.5px}
  .worked{font-variant-numeric:tabular-nums;background:var(--box-gray);border-radius:9px;padding:11px 13px;margin-top:9px;line-height:1.9}
  .worked .step{display:block}
  .learnq{font-size:clamp(28px,8vw,42px);font-weight:800;text-align:center;margin:8px 0 12px;font-variant-numeric:tabular-nums}

  /* achievements */
  .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .ach{border:1px solid var(--hairline);border-radius:var(--radius);padding:11px;background:var(--paper);display:flex;gap:9px;align-items:flex-start}
  .ach.locked{opacity:.45}
  .ach .ico{font-size:20px;line-height:1}
  .ach .t{font-size:12.5px;font-weight:800}
  .ach .d{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.3}

  /* KPI big */
  .bigkpi{text-align:center;padding:8px 0 4px}
  .bigkpi .v{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:var(--red)}
  .bigkpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:800;margin-top:6px}

  /* overlay / sheet */
  .overlay{position:fixed;inset:0;background:rgba(20,10,10,.5);display:none;align-items:flex-end;justify-content:center;z-index:60}
  .overlay.on{display:flex}
  .sheet{background:var(--paper);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
    padding:18px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.28)}
  .sheet .shead{display:flex;align-items:center;margin-bottom:12px}
  .sheet h2{font-size:18px;margin:0}
  .sheet .close{margin-left:auto;background:var(--box-gray);border:none;width:34px;height:34px;border-radius:9px;font-size:16px;cursor:pointer}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;font-weight:800;letter-spacing:.03em;margin-bottom:6px;color:var(--graphite);text-transform:uppercase}
  .field input{width:100%;padding:11px 12px;border:1px solid var(--hairline);border-radius:10px;font-size:16px;font-family:var(--font);color:var(--ink);background:#fff}
  .field input:focus{outline:none;border-color:var(--red)}
  .secpick{display:flex;flex-wrap:wrap;gap:8px}
  .secpick button{border:1px solid var(--hairline);background:var(--paper);border-radius:10px;min-width:48px;padding:11px 14px;font-size:15px;font-weight:800;cursor:pointer}
  .secpick button.on{background:var(--red);color:#fff;border-color:var(--red)}

  /* toasts */
  .toasts{position:fixed;left:0;right:0;bottom:calc(var(--navh) + 12px + env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:11px;box-shadow:var(--shadow);font-size:13px;font-weight:800;display:flex;gap:9px;align-items:center;max-width:90%;animation:tin .3s ease}
  .toast.red{background:var(--red)}
  @keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
  .pop{animation:pop .3s ease}
  .note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
  a{color:var(--red)}

  /* ===== Progreso (estadísticas) ===== */
  .pbar-row{display:grid;grid-template-columns:92px 1fr 96px;align-items:center;gap:10px;margin-bottom:11px;font-size:13px}
  .pbar-row .pl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
  .pbar-track{position:relative;background:var(--box-gray);border:1px solid var(--hairline);border-radius:99px;height:14px;overflow:hidden}
  .pbar-fill{height:100%;background:var(--red);border-radius:99px;transition:width .4s}
  .pbar-fill.dim{background:#c9c9c9}
  .pbar-tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--graphite);opacity:.55}
  .pbar-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  .pbar-val b{color:var(--ink)}
  .ptable{width:100%;border-collapse:collapse;font-size:13px}
  .ptable th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;text-align:right;padding:5px 6px;border-bottom:1px solid var(--hairline)}
  .ptable th:first-child{text-align:left}
  .ptable td{padding:8px 6px;border-bottom:1px solid var(--hairline);text-align:right;font-variant-numeric:tabular-nums}
  .ptable td:first-child{text-align:left;font-weight:700}
  .ptable .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .ptable .dot.weak{background:var(--red)} .ptable .dot.ok{background:#bdbdbd}
  .spark{width:100%;height:130px;display:block;overflow:visible}
  .spark text{font-size:9px;fill:var(--muted);font-family:var(--font)}
  .reco{background:var(--box-red);border:1px solid #f6d5d7;border-radius:var(--radius);padding:14px 16px}
  .reco b{color:var(--red)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:16px;height:4px;border-radius:2px;display:inline-block}

  /* ===== Aprender (mapa de técnicas) ===== */
  .trow{display:flex;align-items:center;gap:11px;padding:13px 4px;border:none;border-bottom:1px solid var(--hairline);background:none;width:100%;cursor:pointer;text-align:left;font-family:var(--font);font-size:14px;color:var(--ink)}
  .trow:last-child{border-bottom:none}
  .trow:active{background:var(--box-gray)}
  .tdot{width:10px;height:10px;border-radius:50%;flex:none}
  .tdot.done{background:var(--red)} .tdot.prog{background:#ef9aa0} .tdot.weak{background:var(--graphite)} .tdot.none{background:var(--paper);border:1.5px solid var(--hairline)}
  .trow .tn{font-weight:700;flex:1;min-width:0}
  .trow .tm{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
  .trow .tm b{color:var(--ink)}
  .trow .chev{color:var(--muted);font-size:20px;flex:none;line-height:1}
  .backlink{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:0;margin-bottom:12px;display:inline-flex;align-items:center;gap:6px;font-weight:700}
  .backlink:active{color:var(--red)}
  .lessonblock{margin-bottom:16px}
  .lessonblock h4{font-size:13px;margin:0 0 6px;color:var(--red);text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<header class="app">
  <div class="bar">
    <div class="mark">×</div>
    <div style="min-width:0">
      <h1>Case Math</h1>
      <div class="sub">Mental math · case prep</div>
    </div>
    <div class="spacer"></div>
    <button class="rankchip" id="rankChip"><span class="ic" id="rcIco">🎒</span><span style="min-width:0"><span class="rt" id="rcName">—</span><span class="rx" id="rcXp"></span></span></button>
    <button class="gear" id="gear" aria-label="Settings">⚙</button>
  </div>
</header>

<main id="app"></main>

<nav class="tabbar" id="tabbar">
  <button class="t on" data-view="train"><span class="i">🏆</span>Train</button>
  <button class="t" data-view="challenge"><span class="i">🎯</span>Challenge</button>
  <button class="t" data-view="progress"><span class="i">📈</span>Progress</button>
  <button class="t" data-view="learn"><span class="i">📚</span>Learn</button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toasts" id="toasts"></div>

<script src="config.js"></script>
<script>
"use strict";
(function(){
/* ============================================================
   Case Math — entrenador de cálculo mental
   Un solo archivo. Progreso en localStorage. Ranking opcional
   vía Supabase (config.js). Motor de dificultad calibrado por
   score + bandas; progresión por ventana móvil (tiempo+acierto).
   ============================================================ */
  var CFG = window.MMCONFIG || {};
  var SECTIONS = CFG.SECTIONS || ["A","B","C","D","E"];
  var KEY="iese_calc_v1";

  /* ---------- RNG con semilla intercambiable (para el reto diario) ---------- */
  var RAND=Math.random;
  function rnd(){ return RAND(); }
  function rint(lo,hi){ return lo+Math.floor(rnd()*(hi-lo+1)); }
  function rpick(a){ return a[Math.floor(rnd()*a.length)]; }
  function mulberry32(seed){ return function(){ var t=seed+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
  function withSeed(seed,fn){ var prev=RAND; RAND=mulberry32(seed>>>0); try{ return fn(); } finally{ RAND=prev; } }
  function seedFromString(s){ var h=1779033703^s.length; for(var i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return h>>>0; }

  /* ---------- helpers ---------- */
  var $=function(s,r){ return (r||document).querySelector(s); };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function fmt(n){ if(!isFinite(n)) return String(n); var r=Math.round(n*100)/100; return r.toLocaleString('de-DE',{maximumFractionDigits:2}); }
  function digitCount(n){ n=Math.abs(n); if(n<1){ var s=String(n).replace('0.','').replace('.',''); return Math.max(1,s.replace(/0+$/,'').length);} return String(Math.round(n)).length; }
  function sigDigits(n){ if(!Number.isInteger(n)){ var s=String(n).replace('.',''); return s.replace(/0+$/,'').length||1;} n=Math.abs(n); if(n===0)return 1; while(n%10===0)n/=10; return String(n).length; }

  function tzeros(n){ n=Math.abs(Math.round(n)); if(n===0)return 0; var z=0; while(n%10===0){n/=10;z++;} return z; }
  function factorPair(n){ n=Math.abs(n); for(var f=2;f<=Math.floor(Math.sqrt(n));f++){ if(n%f===0)return [f,n/f]; } return [1,n]; }

  /* ---------- scorer de dificultad (calibrado, escala ~1..100) ---------- */
  function scoreDifficulty(p){
    var raw;
    if(p.op==='mult'){
      var sa=sigDigits(p.a),sb=sigDigits(p.b),ad=digitCount(p.ans);
      raw=sa*sb*7+ad*2.2+((hasDec(p.b)||hasDec(p.a))?6:0);
      if(p.a===p.b) raw*=0.85;
    } else if(p.op==='div'){
      var sdiv=sigDigits(p.b),sans=sigDigits(p.ans),ex=isExact(p.a,p.b),f=factorPair(p.b)[0];
      raw=sdiv*6+sans*5.5+digitCount(p.a)*1.2+(ex?0:12)+((f===1&&p.b>12)?7:0);
    } else {

      raw=10+nice+sb2*5+digitCount(p.base)*1.4+(p.estimate?-4:0)+(hasDec(p.ans)?5:0);
    }
    return Math.max(1,Math.min(100,Math.round(raw)));
  }

  /* ---------- generadores (tag de estrategia para el explicador) ---------- */
  function mkMult(a,b,st){ return {op:'mult',a:a,b:b,ans:+(a*b).toFixed(2),strat:st,text:fmt(a)+' × '+fmt(b)}; }
  function mkDiv(a,b,st){ return {op:'div',a:a,b:b,ans:+(a/b).toFixed(4),strat:st,text:fmt(a)+' ÷ '+fmt(b)}; }
  function mkPct(p,base,st,est){ return {op:'pct',p:p,base:base,ans:+(p/100*base).toFixed(2),strat:st,estimate:!!est,text:fmt(p)+'% of '+fmt(base)}; }
  var GEN={
    multZeros:function(d){ var a,b; if(d<=1){a=rpick([10,20,50,100,200,500]);b=rint(2,9);} else if(d<=3){a=rpick([200,500,1000,2000,5000]);b=rpick([3,4,5,6,7,8,9,2.5,1.5]);} else {a=rpick([2000,4000,7500,10000,25000]);b=rpick([2.5,3.5,4.5,7.5,6,8]);} return mkMult(a,b,'mult-zeros'); },
    multComp:function(d){ var a,b; if(d<=1){a=rint(11,19);b=rint(3,9);} else if(d<=2){a=rint(12,49);b=rint(4,9);} else if(d<=3){a=rint(11,99);b=rint(11,29);} else {a=rint(21,99);b=rint(12,49);} return mkMult(a,b,'mult-comp'); },
    multSquare:function(d){ var base=d<=2?rpick([11,12,15,25,35]):(d<=3?rpick([45,55,65,75,85]):rpick([95,105,125,15,25])); return mkMult(base,base,'mult-square'); },
    multComplex:function(d){ var a=rint(101,d>=5?899:399),b=rint(12,d>=5?89:39); return mkMult(a,b,'mult-complex'); },
    divZeros:function(d){ var q,div; if(d<=1){div=rpick([10,100]);q=rint(2,20);} else if(d<=3){div=rpick([10,20,50,100,1000]);q=rpick([2,3,4,5,6,7,8,9,12,15,20]);} else {div=rpick([200,500,2500]);q=rpick([3,4,6,8,12,20,40]);} return mkDiv(q*div,div,'div-zeros'); },
    divBreak:function(d){ var div,q; if(d<=2){div=rpick([3,4,5,6]);q=rint(20,120);} else {div=rpick([3,4,6,7,8]);q=rint(30,299);} return mkDiv(div*q,div,'div-break'); },
    divFactor:function(d){ var f1=rpick([3,4,5,6]), f2=rpick([4,6,7,8,9]); var div=f1*f2, q=rint(4,d<=3?24:50); var p=mkDiv(div*q,div,'div-factor'); p.factors=[f1,f2]; return p; },
    pctComp:function(d){ var p,base; if(d<=1){p=rpick([10,20,25,50]);base=rpick([200,400,500,800,1000,1200]);} else if(d<=2){p=rpick([5,10,15,20,25,30,40]);base=rpick([400,560,800,900,1100,1200]);} else if(d<=3){p=rpick([15,30,45,60,75,90]);base=rpick([560,800,950,1050,1230,1600]);} else {p=rpick([9,11,16,42,53,77,83]);base=rint(240,4800);} return mkPct(p,base,'pct-comp'); },
    pctEstimate:function(d){ var p=rpick([33,49,53,66,67,77,83]);var base=rint(1000,d>=5?25000:12000); return mkPct(p,base,'pct-estimate',true); }

  var LEVELS=[

    {n:'Clean division',      t:7,  band:[19,27], fams:[['divBreak',1],['divBreak',2],['divFactor',2],['divFactor',3],['divZeros',3]], d:'Divide by splitting-and-adding, and by factoring.'},
    {n:'Easy percentages',    t:7,  band:[19,28], fams:[['pctComp',1],['pctComp',2],['divZeros',4],['multZeros',3]], d:'Round % (10/20/25/50%) using 1% and 10%.'},

  function genForLevel(lv){
    var L=LEVELS[lv-1],best=null,bg=1e9;
    for(var i=0;i<80;i++){
      var f=L.fams[Math.floor(rnd()*L.fams.length)]; var p=GEN[f[0]](f[1]); var s=scoreDifficulty(p);

  }

    var TIERS=[['Basic','levels 1–3',[1,2,3]],['Intermediate','levels 4–6',[4,5,6]],['Advanced','levels 7–8',[7,8]],['Exam','levels 9–10',[9,10]]];
    var tierAgg=TIERS.map(function(){return {n:0,ok:0,sum:0};});
    h.forEach(function(a){ for(var i=0;i<TIERS.length;i++){ if(TIERS[i][2].indexOf(a.lv)>=0){ tierAgg[i].n++; if(a.ok)tierAgg[i].ok++; tierAgg[i].sum+=a.t; break; } } });
    var tierRows=TIERS.map(function(T,i){ var e=tierAgg[i]; if(!e.n) return ''; var a=Math.round(acc(e)*100);
      return '<div class="pbar-row"><div class="pl">'+esc(T[0])+'<br><span class="note" style="margin:0;font-weight:400;font-size:10px">'+esc(T[1])+'</span></div><div class="pbar-track"><div class="pbar-fill" style="width:'+a+'%"></div><div class="pbar-tick" style="left:85%"></div></div><div class="pbar-val"><b>'+a+'%</b> · '+avgT(e).toFixed(1)+'s · '+e.n+'</div></div>'; }).join('');

    // --- tendencia por día (precisión) ---
    var byDay={}; h.forEach(function(a){ var d=new Date(a.ts); var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); (byDay[k]=byDay[k]||{n:0,ok:0,sum:0}); byDay[k].n++; if(a.ok)byDay[k].ok++; byDay[k].sum+=a.t; });
    var days=Object.keys(byDay).sort().slice(-10);
    var trendPts=days.map(function(k){ var e=byDay[k]; var dd=k.split('-'); return {label:dd[2]+'/'+dd[1], v:e.ok/e.n}; });

    // --- por TÉCNICA (cada técnica ≈ dificultad homogénea; desplegable con su explicación) ---
    function stratDesc(k){ var d=STRATDEFS.filter(function(x){return x[0]===k;})[0]; return d?d[3]:''; }
    var stratKeys=Object.keys(s.byStrat).filter(function(k){ return s.byStrat[k].n>=3 && STRAT_NAME[k]; })
      .sort(function(a,b){ return acc(s.byStrat[a])-acc(s.byStrat[b]); });
    var techCards=stratKeys.map(function(k){ var e=s.byStrat[k], a=Math.round(acc(e)*100), t=avgT(e), weak=a<75;
      var ex=''; try{ ex=workedHTML(EXGEN[k]()); }catch(_){}
      return '<details class="strat"><summary>'+
        '<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+(weak?'var(--red)':'#bdbdbd')+';flex:none"></span>'+
        '<span>'+esc(STRAT_NAME[k])+'</span>'+
        '<span style="margin-left:auto;font-variant-numeric:tabular-nums;color:'+(weak?'var(--red)':'var(--muted)')+';font-weight:800;font-size:12.5px">'+a+'% · '+t.toFixed(1)+'s · '+e.n+'</span></summary>'+
        '<div class="body"><p style="margin:0 0 2px"><b>What it is:</b> '+esc(stratDesc(k))+'</p>'+ex+
        '<button class="btn ghost" data-learn="1" style="margin-top:10px">Practise in Learn</button></div></details>'; }).join('');

    // --- recomendación: técnica más floja con datos suficientes ---
    var reco='';
    if(stratKeys.length && s.byStrat[stratKeys[0]].n>=6){
      var wk=stratKeys[0], we=s.byStrat[wk], wa=Math.round(acc(we)*100), wt=avgT(we).toFixed(1);
      reco='<div class="reco"><b>Your weakest technique: '+esc(STRAT_NAME[wk])+'</b> — '+wa+'% correct and '+wt+'s on average. Review it above and practise it.'+
        '<div style="margin-top:10px"><button class="btn red" id="pReco">See this technique in Learn</button></div></div>';
    } else {
      reco='<div class="reco" style="background:var(--box-gray);border-color:var(--hairline)"><b style="color:var(--ink)">Keep practising</b> — with a few more problems in each technique I\'ll tell you exactly what to focus on.</div>';
    }

    var rf=rankFor(p.xp||0), rpct=rf.nx?Math.min(100,((p.xp-rf.r.xp)/(rf.nx.xp-rf.r.xp))*100):100;
    app.innerHTML=
      '<div class="sechead"><div><div class="kicker">Your performance</div><h2>Progress</h2></div><div class="rule"></div></div>'+
      '<div class="card" id="pRankCard" style="cursor:pointer"><div style="display:flex;align-items:center;gap:12px">'+
        '<div style="width:44px;height:44px;border-radius:12px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;flex:none">'+rf.r.ico+'</div>'+
        '<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:800">'+esc(rf.r.name)+'</div>'+
          '<div class="note" style="margin:2px 0 0">Current difficulty level: <b>'+(p.level||1)+'</b> · best streak '+(p.bestStreak||0)+'</div>'+
          '<div class="lvlbar" style="margin-top:7px"><span style="width:'+rpct.toFixed(0)+'%"></span></div></div>'+
        '<div style="text-align:right;flex:none"><div style="font-size:17px;font-weight:800;font-variant-numeric:tabular-nums">'+fmt(p.xp||0)+'</div><div class="note" style="margin:0">'+(rf.nx?'/ '+fmt(rf.nx.xp)+' XP':'max XP')+'</div></div>'+
      '</div></div>'+
      '<div class="hud"><div class="c"><div class="lab">Solved</div><div class="val">'+totalN+'</div></div><div class="c"><div class="lab">Accuracy</div><div class="val">'+gAcc+'<small>%</small></div></div><div class="c"><div class="lab">Avg</div><div class="val">'+gAvg.toFixed(1)+'<small>s</small></div></div></div>'+
      (tierRows?'<div class="card"><span class="kicker">By difficulty</span><p class="note" style="margin:-4px 0 12px">Your accuracy and time in each level band. This is fair to compare: same band = same difficulty. The grey mark is the target (85%).</p>'+tierRows+'</div>':'')+
      (techCards?'<div class="card"><span class="kicker">By technique</span><p class="note" style="margin:-4px 0 12px">Weakest to best (red dot = below 75%). Tap each one to see <b>what it is</b> and an example.</p>'+techCards+'</div>':'')+
      '<div class="card"><span class="kicker">Trend (accuracy per day)</span>'+sparkline(trendPts,function(p){return Math.round(p.v*100)+'%';})+'</div>'+
      '<div class="card">'+reco+'</div>';

    $("#pReco") && ($("#pReco").onclick=function(){ setView('learn'); });
    $("#pRankCard") && ($("#pRankCard").onclick=openRankGuide);
    app.querySelectorAll('[data-learn]').forEach(function(b){ b.onclick=function(){ setView('learn'); }; });
  }

  /* ---------- teclado numérico ---------- */
  function keypadHTML(){ var ks=['7','8','9','4','5','6','1','2','3','del','0',','];
    return '<div class="keypad" id="keypad">'+ks.map(function(k){
      if(k==='del') return '<button class="key del" data-k="del">⌫</button>';
      if(k===',') return '<button class="key" data-k=",">,</button>';
      return '<button class="key" data-k="'+k+'">'+k+'</button>';
    }).join('')+'<button class="key ok" data-k="ok" style="grid-column:1/-1">✓ Check</button></div>'; }

  // generic keyboard input handler (on-screen + physical)
  function makeInput(getDisplay, onEnter){
    var entry="";
    function paint(){ var el=getDisplay(); if(!el)return; if(entry===""){ el.textContent="your answer"; el.classList.add('empty'); } else { el.textContent=entry; el.classList.remove('empty'); } }
    function press(k){ if(k==='ok'){ onEnter(entry); return; } if(k==='del'){ entry=entry.slice(0,-1); paint(); return; }
      if(k===','){ if(entry.indexOf(',')<0&&entry!=="") entry+=','; return void paint(); }
      if(entry.replace(/[^0-9]/g,'').length<9){ entry+=k; paint(); } }
    return { press:press, clear:function(){entry="";paint();}, get:function(){return entry;}, paint:paint };
  }

  /* ============ ENTRENAR (adaptativo + libre) ============ */
  var WIN=8,PROMOTE=0.74,DEMOTE=0.42,MINSAMP=6;
  function perfOf(ok,time,target){ if(!ok)return 0; var r=time/target; if(r<=0.6)return 1; if(r<=1)return .85; if(r<=1.5)return .6; if(r<=2.5)return .3; return .15; }
  var trainMode='adapt';
  function renderTrain(){
    cancelAnimationFrame(raf);
    app.innerHTML = '<div id="tBody"></div>';
    if(trainMode==='free') renderFree(); else renderAdaptive();
  }

  function renderAdaptive(){
    var p=db.prog;
    var today=todayISO(); if(p.days.indexOf(today)<0){ p.days.push(today); save(); if(p.days.length>=3) unlock('days3'); }
    var ses={count:0,correct:0,total:0,combo:0,noFail:0,ops:{},cur:null,shownAt:0,paused:false,target:5};

    $("#tBody").innerHTML =
      '<div class="hud">'+
        '<div class="c"><div class="lab">Level</div><div class="val" id="hLv">—</div><div class="lvlbar"><span id="hLvBar"></span></div></div>'+
        '<div class="c"><div class="lab">Session avg</div><div class="val" id="hAvg">—</div></div>'+
        '<div class="c"><div class="lab">Accuracy</div><div class="val" id="hAcc">—</div></div>'+
      '</div>'+
      '<div class="card play">'+
        '<div class="combo" id="hCombo">&nbsp;</div>'+
        '<div class="timerbar"><span id="hTimer"></span></div>'+
        '<div id="hEst"></div>'+
        '<div class="problem" id="hProblem">—</div>'+
        '<div class="answer empty" id="hAns">your answer</div>'+
        '<div class="feedback" id="hFb">&nbsp;</div>'+
        keypadHTML()+
        '<div class="miniact"><button id="hSkip">Skip</button><button id="hPause">⏸ Pause</button><button id="hGuide">📋 Levels</button></div>'+
        '<div style="margin-top:16px">'+
          '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px"><span id="hPerfMsg" style="font-size:11px;font-weight:800;letter-spacing:.02em">&nbsp;</span><span id="hPerfN" class="note" style="margin:0"></span></div>'+
          '<div class="perfmeter"><div class="perf-fill" id="hPerfFill"></div><div class="perf-tick" style="left:42%"></div><div class="perf-tick" style="left:74%"></div></div>'+
          '<div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-top:4px"><span>🔽 level down</span><span>level up 🔼</span></div>'+
        '</div>'+
        '<div class="note">This meter is your <b>recent performance</b> (accuracy + speed of your last answers). It rises when you answer fast and falls when you miss or go slow; cross the right mark to level up, drop below the left mark to level down. Pausing protects your progress.</div>'+
      '</div>'+
      '<details class="card"><summary style="cursor:pointer;font-weight:800;font-size:14px" id="achSum">🏅 Achievements — '+Object.keys(p.ach).length+'/'+ACHS.length+'</summary><div class="ach-grid" id="achGrid" style="margin-top:12px">'+achGridHTML()+'</div></details>'+
      '<button class="btn ghost block" id="hToFree" style="margin-top:4px">🎛️ Free practice (choose your own digits)</button>';

    $("#hToFree").onclick=function(){ cancelAnimationFrame(raf); trainMode='free'; renderTrain(); };
    var input=makeInput(function(){return $("#hAns");}, submit);
    function paintHUD(){ var L=LEVELS[Math.min(p.level,LEVELS.length)-1];
      $("#hLv").innerHTML=p.level+' <small>· '+esc(L.n)+'</small>';
      $("#hLvBar").style.width=(p.level/LEVELS.length*100)+'%';
      $("#hAvg").innerHTML=ses.count?(ses.total/ses.count).toFixed(1)+'<small>s</small>':'—';
      $("#hAcc").textContent=ses.count?Math.round(ses.correct/ses.count*100)+'%':'—';
      $("#hCombo").innerHTML=ses.combo>1?'🔥 Streak ×'+ses.combo:'&nbsp;';
      var pf=windowPerf(), n=p.win.length;
      var fill=$("#hPerfFill"); fill.style.width=Math.round(pf*100)+'%';
      fill.classList.toggle('danger', n>=MINSAMP && pf<=DEMOTE+0.06);
      $("#hPerfN").textContent=n+'/'+WIN+' answers';
      var msg,col='var(--ink)';
      if(n<MINSAMP){ msg='Calibrating level · '+n+'/'+MINSAMP; col='var(--muted)'; }
      else if(pf>=PROMOTE-0.10){ msg='🔼 About to level up'; col='var(--red)'; }
      else if(pf<=DEMOTE+0.06){ msg='🔽 At risk of dropping a level'; col='var(--red)'; }
      else { msg='Keep it up'; col='var(--muted)'; }
      var mEl=$("#hPerfMsg"); mEl.textContent=msg; mEl.style.color=col;
    }
    function windowPerf(){ if(!p.win.length)return 0; return p.win.reduce(function(a,b){return a+b;},0)/p.win.length; }
    function startTimer(target){ cancelAnimationFrame(raf); var bar=$("#hTimer"); if(!bar)return;
      var tick=function(){ if(!document.body.contains(bar))return; var el=(performance.now()-ses.shownAt)/1000; var frac=Math.min(1,el/target);
        bar.style.width=(frac*100).toFixed(1)+'%'; bar.style.background=frac<1?'var(--red)':'var(--hairline)'; if(frac<1)raf=requestAnimationFrame(tick); };
      raf=requestAnimationFrame(tick); }
    function next(){ ses.paused=false; var L=LEVELS[Math.min(p.level,LEVELS.length)-1]; ses.target=L.t; ses.cur=genForLevel(p.level);
      $("#hEst").innerHTML=ses.cur.estimate?'<span class="tag-est">≈ estimate (±2%)</span>':'';
      var pr=$("#hProblem"); pr.textContent=ses.cur.text; pr.classList.remove('pop'); void pr.offsetWidth; pr.classList.add('pop');
      input.clear(); ses.shownAt=performance.now(); startTimer(ses.target); }
    function submit(raw){ if(ses.paused||!ses.cur)return; var val=parseAns(raw); if(val==null)return;
      cancelAnimationFrame(raf); var dt=(performance.now()-ses.shownAt)/1000; var ok=isCorrect(ses.cur,val);
      ses.count++; ses.total+=dt; if(ok)ses.correct++; p.solved++; p.byType[ses.cur.op]=(p.byType[ses.cur.op]||0)+1;
      recordAttempt(ses.cur, ok, dt, p.level, 'adapt');
      var fb=$("#hFb");
      if(ok){ p.correct++; ses.combo++; ses.noFail++; ses.ops[ses.cur.op]=1;
        var xp=awardXP(p.level,dt,ses.target,ses.combo); p.xp+=xp;
        if(ses.combo>p.bestStreak)p.bestStreak=ses.combo;
        unlock('first'); if(dt<3)unlock('fast3'); if(dt<2)unlock('fast2');
        if(ses.combo>=10)unlock('streak10'); if(ses.combo>=20)unlock('streak20');
        if(p.solved>=200)unlock('solved200'); if(ses.noFail>=20)unlock('perfect');
        if(ses.ops.mult&&ses.ops.div&&ses.ops.pct)unlock('allops');
        fb.className='feedback ok'; fb.textContent='✓ '+ses.cur.text+' = '+fmt(ses.cur.ans)+' · '+dt.toFixed(1)+'s · +'+xp+' XP';
      } else { ses.combo=0; ses.noFail=0; fb.className='feedback bad'; fb.textContent='✗ '+raw+' · was '+fmt(ses.cur.ans)+' ('+ses.cur.text+')'; }
      // ventana móvil de rendimiento -> subir / bajar
      p.win.push(perfOf(ok,dt,ses.target)); if(p.win.length>WIN)p.win.shift();
      if(p.win.length>=MINSAMP){ var perf=p.win.reduce(function(a,b){return a+b;},0)/p.win.length;
        if(perf>=PROMOTE&&p.level<LEVELS.length){ p.level++; p.win=[]; if(p.level>p.maxLevel)p.maxLevel=p.level;
          if(p.level>=5)unlock('lvl5'); if(p.level>=10)unlock('lvl10'); toast('🏆','Level up! '+p.level+': '+LEVELS[p.level-1].n,'red'); }
        else if(perf<=DEMOTE&&p.level>1){ p.level--; p.win=[]; toast('📉','Down to level '+p.level+': '+LEVELS[p.level-1].n,''); } }
      paintRank(); save(); paintHUD(); refreshAch(); next();
    }
    function togglePause(){ var b=$("#hPause"),pr=$("#hProblem"),fb=$("#hFb");
      if(!ses.paused){ ses.paused=true; cancelAnimationFrame(raf); pr.textContent='⏸'; fb.className='feedback'; fb.textContent='Paused — your progress is safe'; b.textContent='▶ Resume'; }
      else { ses.paused=false; pr.textContent=ses.cur?ses.cur.text:'—'; fb.className='feedback'; fb.innerHTML='&nbsp;'; b.textContent='⏸ Pause'; ses.shownAt=performance.now(); startTimer(ses.target); } }

    $("#keypad").addEventListener('click',function(e){ var b=e.target.closest('[data-k]'); if(b)input.press(b.dataset.k); });
    $("#hSkip").onclick=function(){ if(ses.paused)return; cancelAnimationFrame(raf); ses.combo=0; var fb=$("#hFb"); fb.className='feedback'; fb.innerHTML='&nbsp;'; paintHUD(); next(); };
    $("#hPause").onclick=togglePause;
    $("#hGuide").onclick=openGuide;
    keydownHandler=function(e){ if(document.querySelector('.overlay.on'))return; if(e.key>='0'&&e.key<='9')input.press(e.key); else if(e.key==='Enter'){e.preventDefault();input.press('ok');} else if(e.key==='Backspace'){e.preventDefault();input.press('del');} else if(e.key===','||e.key==='.')input.press(','); };
    paintHUD(); next();
  }

  function openGuide(){ var p=db.prog;
    var rows=LEVELS.map(function(L,i){ var n=i+1,cur=n===p.level,passed=n<p.level;
      return '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hairline);'+(cur?'font-weight:800':'')+'">'+

  function runChallenge(id){

  /* ============ RANKING (Supabase) ============ */
  function sbReady(){ return !!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY); }

  function submitScore(id,score,correct,total,seconds){

  function fetchScores(id){

    return fetch(url,{headers:sbHeaders()}).then(function(r){ if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); });
  }
  var rankFilter="global";

  /* ============ LEARN (MBB strategies) ============ */
  function explainSteps(p){ var F=fmt; switch(p.strat){
    case 'mult-zeros':{ var za=tzeros(p.a),cA=p.a/Math.pow(10,za),st=[]; if(za>0)st.push(F(p.a)+' = '+F(cA)+' × '+F(Math.pow(10,za))); st.push(F(cA)+' × '+F(p.b)+' = '+F(cA*p.b)); if(za>0)st.push(F(cA*p.b)+' × '+F(Math.pow(10,za))+' = '+F(p.ans)); return {title:'Factor out the zeros',steps:st}; }
    case 'mult-comp': case 'mult-complex':{ var big=p.a>=p.b?p.a:p.b,small=p.a>=p.b?p.b:p.a,tens=Math.floor(big/10)*10,ones=big-tens; return {title:p.strat==='mult-complex'?'Double decomposition':'Break apart and add',steps:[F(small)+' × '+F(big)+' = '+F(small)+' × ('+F(tens)+' + '+F(ones)+')',F(small)+' × '+F(tens)+' = '+F(small*tens),F(small)+' × '+F(ones)+' = '+F(small*ones),F(small*tens)+' + '+F(small*ones)+' = '+F(p.ans)]}; }
    case 'mult-square':{ var n=p.a; if(n%10===5&&n<100){ var dd=(n-5)/10; return {title:'Squares ending in 5',steps:[n+'²: take '+dd+' × '+(dd+1)+' = '+dd*(dd+1),'Stick "25" on the end → '+F(p.ans)]}; } var t2=Math.floor(n/10)*10,o2=n-t2; return {title:'Square by decomposition',steps:[n+'² = '+n+' × ('+t2+' + '+o2+')',n+' × '+t2+' = '+F(n*t2),n+' × '+o2+' = '+F(n*o2),F(n*t2)+' + '+F(n*o2)+' = '+F(p.ans)]}; }
    case 'div-zeros':{ var z=Math.min(tzeros(p.a),tzeros(p.b)),st2=[]; if(z>0)st2.push('Drop '+z+' zero(s) from each side: '+F(p.a/Math.pow(10,z))+' ÷ '+F(p.b/Math.pow(10,z))); st2.push(F(p.a/Math.pow(10,z))+' ÷ '+F(p.b/Math.pow(10,z))+' = '+F(p.ans)); return {title:'Cancel zeros',steps:st2}; }
    case 'div-break':{ var b=p.b,q=p.ans,p1=b*(Math.floor(q/10)*10),p2=p.a-p1,st3=[F(p.a)+' ÷ '+b+' = ('+F(p1)+' + '+F(p2)+') ÷ '+b]; if(p1)st3.push(F(p1)+' ÷ '+b+' = '+F(p1/b)); st3.push(F(p2)+' ÷ '+b+' = '+F(p2/b)); st3.push(F(p1/b)+' + '+F(p2/b)+' = '+F(p.ans)); return {title:'Split and add',steps:st3}; }
    case 'div-factor':{ var fp=p.factors||factorPair(p.b); if(fp[0]===1)return {title:'Direct division',steps:[F(p.a)+' ÷ '+p.b+' = '+F(p.ans)]}; return {title:'Factor the divisor in two steps',steps:['Split '+p.b+' into two times-table numbers: '+p.b+' = '+fp[0]+' × '+fp[1],F(p.a)+' ÷ '+fp[0]+' = '+F(p.a/fp[0]),F(p.a/fp[0])+' ÷ '+fp[1]+' = '+F(p.ans)]}; }
    case 'pct-comp':{ var base=p.base,P=Math.round(p.p),one=base*0.01,ten=base*0.1,tens3=Math.floor(P/10),ones3=P%10,st4=['1% of '+F(base)+' = '+F(one)+'   ·   10% = '+F(ten)],parts=[]; if(tens3){st4.push((tens3*10)+'% = '+tens3+' × 10% = '+F(ten*tens3));parts.push(ten*tens3);} if(ones3){st4.push(ones3+'% = '+ones3+' × 1% = '+F(one*ones3));parts.push(one*ones3);} if(parts.length>1)st4.push(parts.map(F).join(' + ')+' = '+F(p.ans)); return {title:'Percentages by components',steps:st4}; }
    case 'pct-estimate':{ var rp=Math.round(p.p/10)*10,rb=Math.round(p.base/100)*100; return {title:'Estimate (round and adjust)',steps:['Round: '+F(p.p)+'% ≈ '+rp+'%, '+F(p.base)+' ≈ '+F(rb),rp+'% of '+F(rb)+' = '+F(rp/100*rb),'Exact: '+F(p.ans)+' (the estimate gets you close)']}; }
    default: return {title:'Calculation',steps:[p.text+' = '+F(p.ans)]};
  } }
  function workedHTML(p){ var e=explainSteps(p); return '<div class="worked"><b>'+esc(e.title)+'</b>'+e.steps.map(function(s){return '<span class="step">'+s+'</span>';}).join('')+'<span class="step" style="margin-top:6px"><b>Result: '+fmt(p.ans)+'</b></span></div>'; }
  var STRATDEFS=[
    ['mult-zeros','Multiplication','Zeros','Factor out the zeros: drop them, multiply the essential part, then put them back.'],
    ['mult-comp','Multiplication','Components','Break a number into tens + units, multiply each part and add.'],
    ['mult-complex','Multiplication','Complex components','Double break-apart for hard cases with no paper.'],
    ['mult-square','Multiplication','Squares','Tricks for squaring (numbers ending in 5 are instant).'],
    ['div-zeros','Division','Zeros','Cancel the same zeros top and bottom before dividing.'],
    ['div-break','Division','Split & add','Split the number into "clean" chunks and add the results.'],
    ['div-factor','Division','Factoring','Split the divisor into two times-table numbers and divide in two steps (÷12 = ÷3 then ÷4).'],
    ['pct-comp','Percentages','By components','Lean on 1% and 10% and combine them (40% = 4×10%).'],
    ['pct-estimate','Percentages','Estimate','Round the % and the base to estimate fast; in a case, ask whether estimating is OK.']
  ];
  var EXGEN={'mult-zeros':function(){return GEN.multZeros(4);},'mult-comp':function(){return GEN.multComp(3);},'mult-complex':function(){return GEN.multComplex(4);},'mult-square':function(){return GEN.multSquare(3);},'div-zeros':function(){return GEN.divZeros(3);},'div-break':function(){return GEN.divBreak(3);},'div-factor':function(){return GEN.divFactor(3);},'pct-comp':function(){return GEN.pctComp(4);},'pct-estimate':function(){return GEN.pctEstimate(3);}};
  var LEARN_WHEN={
    'mult-zeros':'When a number is round or ends in zeros (200, 1,500, or ×2.5 / ×7.5).',
    'mult-comp':'To multiply two 2-digit numbers in your head.',
    'mult-complex':'When one has 3 digits: break it into manageable parts.',
    'mult-square':'When squaring a number; those ending in 5 are instant.',
    'div-zeros':'When the dividend and divisor share zeros: cancel them first.',
    'div-break':'Small divisor (3–8): split the number into chunks that divide cleanly.',
    'div-factor':'Divisor that splits into two times-table numbers (12 = 3×4, 24 = 4×6): divide in two steps.',
    'pct-comp':'Almost any %: combine 10% and 1% (40% = 4×10%, 3% = 3×1%).',
    'pct-estimate':'Awkward % over big bases when a good estimate is enough.'
  };
  function learnMastery(key){ var e=db.stats.byStrat[key];
    if(!e||e.n<5) return {lab:(e&&e.n)?'Barely practised':'Not practised', cls:'none', n:e?e.n:0};
    var a=e.ok/e.n, cls=a>=0.85?'done':(a>=0.70?'prog':'weak'), lab=a>=0.85?'Mastered':(a>=0.70?'In progress':'Needs work');
    return {lab:lab, cls:cls, acc:Math.round(a*100), t:e.sum/e.n, n:e.n}; }

      }).join('');
      app.innerHTML=
        '<div class="sechead"><div><div class="kicker">Techniques · Mental Math (MBB)</div><h2>Learn</h2></div><div class="rule"></div></div>'+
        '<div class="card"><p style="margin:0">Learn each mental-math technique, see a worked example and <b>practise it on its own</b>. The dot shows your mastery: <span class="tdot none" style="display:inline-block;vertical-align:middle"></span> not practised · <span class="tdot weak" style="display:inline-block;vertical-align:middle"></span> needs work · <span class="tdot prog" style="display:inline-block;vertical-align:middle"></span> in progress · <span class="tdot done" style="display:inline-block;vertical-align:middle"></span> mastered.</p></div>'+

    }
    function paintLesson(key){
      keydownHandler=null;
      var def=STRATDEFS.filter(function(s){return s[0]===key;})[0]; if(!def) return paintMap();
      var m=learnMastery(key), ex=EXGEN[key]();
      var masteryHTML = m.cls==='none'
        ? '<p class="note" style="margin:0">No data yet for this technique. Practise it to measure your mastery.</p>'
        : '<div class="pbar-row" style="margin:0"><div class="pl">'+esc(m.lab)+'</div><div class="pbar-track"><div class="pbar-fill" style="width:'+m.acc+'%"></div><div class="pbar-tick" style="left:85%"></div></div><div class="pbar-val"><b>'+m.acc+'%</b> · '+m.t.toFixed(1)+'s · '+m.n+'</div></div>';
      app.innerHTML=
        '<button class="backlink" id="lnBack">← All techniques</button>'+
        '<div class="sechead"><div><div class="kicker">'+esc(def[1])+'</div><h2>'+esc(def[2])+'</h2></div><div class="rule"></div></div>'+
        '<div class="card">'+
          '<div class="lessonblock"><h4>The idea</h4><p style="margin:0">'+esc(def[3])+'</p></div>'+
          '<div class="lessonblock"><h4>When to use it</h4><p style="margin:0">'+esc(LEARN_WHEN[key]||'')+'</p></div>'+
          '<div class="lessonblock"><h4>Worked example</h4><div id="lnEx">'+workedHTML(ex)+'</div><button class="btn ghost" id="lnOther" style="margin-top:8px">Another example</button></div>'+
          '<div class="lessonblock"><h4>Your mastery</h4>'+masteryHTML+'</div>'+
          '<button class="btn red block" id="lnDrill">Practise 10 of this technique</button>'+
        '</div>';
      $("#lnBack").onclick=paintMap;
      $("#lnOther").onclick=function(){ $("#lnEx").innerHTML=workedHTML(EXGEN[key]()); };
      $("#lnDrill").onclick=function(){ runDrill(key); };
    }
    function runDrill(key){
      var def=STRATDEFS.filter(function(s){return s[0]===key;})[0], N=10, idx=0, correct=0, totalT=0, cur=null, shownAt=0;
      function screen(){
        app.innerHTML=
          '<div class="sechead"><div><div class="kicker">Practising · '+esc(def[2])+'</div><h2 id="dQn">1/'+N+'</h2></div><div class="rule"></div></div>'+
          '<div class="card play">'+
            '<div id="dEst"></div>'+
            '<div class="problem" id="dProblem">—</div>'+
            '<div class="answer empty" id="dAns">your answer</div>'+
            '<div class="feedback" id="dFb">&nbsp;</div>'+
            keypadHTML()+
            '<div class="miniact"><button id="dQuit">Quit</button></div>'+
          '</div>';
        $("#keypad").addEventListener('click',function(e){ var b=e.target.closest('[data-k]'); if(b)input.press(b.dataset.k); });
        $("#dQuit").onclick=function(){ paintLesson(key); };
      }
      var input=makeInput(function(){return $("#dAns");}, answer);
      function show(){ cur=EXGEN[key](); $("#dQn").textContent=(idx+1)+'/'+N; $("#dEst").innerHTML=cur.estimate?'<span class="tag-est">≈ estimate (±2%)</span>':''; var pr=$("#dProblem"); pr.textContent=cur.text; pr.classList.remove('pop'); void pr.offsetWidth; pr.classList.add('pop'); input.clear(); shownAt=performance.now(); }
      function answer(raw){ if(!cur)return; var val=parseAns(raw); if(val==null)return; var dt=(performance.now()-shownAt)/1000, ok=isCorrect(cur,val);
        if(ok)correct++; totalT+=dt; recordAttempt(cur, ok, dt, 0, 'learn');
        var fb=$("#dFb"); fb.className='feedback '+(ok?'ok':'bad'); fb.textContent=(ok?'✓ ':'✗ ')+cur.text+' = '+fmt(cur.ans)+(ok?' · '+dt.toFixed(1)+'s':'');
        idx++; save(); var t=cur; cur=null; if(idx<N){ setTimeout(show,750); } else { setTimeout(finish,850); } }
      function finish(){ var m=learnMastery(key);
        app.innerHTML=
          '<div class="sechead"><div><div class="kicker">Practice finished</div><h2>'+esc(def[2])+'</h2></div><div class="rule"></div></div>'+
          '<div class="card"><div class="bigkpi"><div class="v">'+Math.round(correct/N*100)+'%</div><div class="l">correct ('+correct+'/'+N+')</div></div>'+
            '<div class="hud" style="margin-top:14px"><div class="c"><div class="lab">Avg</div><div class="val">'+(totalT/N).toFixed(1)+'<small>s</small></div></div><div class="c"><div class="lab">Mastery</div><div class="val" style="font-size:15px">'+esc(m.lab)+'</div></div></div>'+
            '<div class="row" style="margin-top:14px"><button class="btn red block" id="dAgain">Practise 10 more</button><button class="btn ghost block" id="dBack">Back to the technique</button></div>'+
          '</div>';
        $("#dAgain").onclick=function(){ runDrill(key); };
        $("#dBack").onclick=function(){ paintLesson(key); };
      }
      keydownHandler=function(e){ if(document.querySelector('.overlay.on'))return; if(e.key>='0'&&e.key<='9')input.press(e.key); else if(e.key==='Enter'){e.preventDefault();input.press('ok');} else if(e.key==='Backspace'){e.preventDefault();input.press('del');} else if(e.key===','||e.key==='.')input.press(','); };
      screen(); show();
    }
    paintMap();
  }

  /* ============ ONBOARDING (crear cuenta / entrar) ============ */
  function renderOnboard(){
    var mode='new';
    function paint(prefill){
      var isNew=mode==='new', section='';
      app.innerHTML=
        '<div class="sechead"><div><div class="kicker">Welcome</div><h2>Case Math</h2></div><div class="rule"></div></div>'+
        '<div class="card">'+
          '<p style="margin-top:0">Practise mental math for your <b>case interviews</b>: adaptive levels, a daily challenge and a leaderboard with your classmates. <span class="muted">A student project, unofficial and not affiliated with any institution.</span></p>'+
          '<div class="seg" id="obSeg"><button data-m="new" class="'+(isNew?'on':'')+'">I\'m new</button><button data-m="login" class="'+(!isNew?'on':'')+'">I have an account</button></div>'+
          '<div class="field"><label>First and last name (or nickname)</label><input id="obNick" maxlength="24" placeholder="e.g. Pedro Bodega" autocomplete="off"></div>'+
          (isNew?'<div class="field"><label>Your section</label><div class="secpick" id="obSec">'+SECTIONS.map(function(s){return '<button data-s="'+s+'">'+s+'</button>';}).join('')+'</div></div>':'')+
          '<div class="field"><label>4-digit PIN'+(isNew?' (to recover your account on another device)':'')+'</label><input id="obPin" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off" style="letter-spacing:.45em;font-size:22px;font-weight:800;max-width:150px;text-align:center"></div>'+
          '<div class="feedback" id="obErr" style="text-align:left;min-height:20px">&nbsp;</div>'+
          '<button class="btn red block" id="obGo">'+(isNew?'Create account & start':'Sign in')+'</button>'+
          '<p class="note">'+(isNew?'Your name identifies you on the leaderboard. Note down your PIN: you\'ll need it to sign in from another device.':'Sign in with the same name and PIN you registered with — you\'ll recover your progress.')+'</p>'+
        '</div>';
      var nickEl=$("#obNick"), pinEl=$("#obPin"), go=$("#obGo"), err=$("#obErr");
      if(prefill){ nickEl.value=prefill.nick||''; if(prefill.msg){ err.className='feedback bad'; err.textContent=prefill.msg; } }
      pinEl.addEventListener('input',function(){ pinEl.value=pinEl.value.replace(/\D/g,'').slice(0,4); });
      document.querySelectorAll('#obSeg button').forEach(function(b){ b.onclick=function(){ mode=b.dataset.m; paint(); }; });
      if(isNew) document.querySelectorAll('#obSec button').forEach(function(b){ b.onclick=function(){ section=b.dataset.s; document.querySelectorAll('#obSec button').forEach(function(x){x.classList.toggle('on',x===b);}); }; });
      function fail(m){ err.className='feedback bad'; err.textContent=m; go.disabled=false; go.textContent=isNew?'Create account & start':'Sign in'; }
      function enter(nick,section2){ db.profile={nick:nick,section:section2}; db.auth={nick:nick,pin:pinEl.value}; save(); toast('👋','Hi, '+nick+'!','red'); setView('train'); }
      go.onclick=function(){
        var nick=nickEl.value.trim(), pin=pinEl.value;
        if(nick.length<2) return fail('Enter your name (at least 2 letters).');
        if(!/^[0-9]{4}$/.test(pin)) return fail('The PIN must be 4 digits.');
        if(isNew && !section) return fail('Choose your section.');
        go.disabled=true; go.textContent='One moment…'; err.className='feedback'; err.innerHTML='&nbsp;';
        if(!sbReady()){ return enter(nick, section||'A'); }   // no backend: local account
        if(isNew){
          accountRegister(nick,section,pin).then(function(res){
            if(res.ok){ enter(nick,section); }
            else if(res.error==='taken'){ mode='login'; paint({nick:nick, msg:'That name already exists. If it\'s you, sign in with your PIN.'}); }
            else if(res.error==='pin_format') fail('The PIN must be 4 digits.');
            else if(res.error==='nick_short') fail('Enter your name (at least 2 letters).');
            else fail('Could not create the account. Please try again.');
          }).catch(function(){ fail('No connection. Please try again.'); });
        } else {
          accountLogin(nick,pin).then(function(res){
            if(res.ok){ applyCloudState(res.state); enter(res.nick,res.section); }
            else if(res.error==='not_found') fail('No account with that name. If you\'re new, use "I\'m new".');
            else if(res.error==='bad_pin') fail('Wrong PIN.');
            else fail('Could not sign in. Please try again.');
          }).catch(function(){ fail('No connection. Please try again.'); });
        }
      };
    }
    paint();
  }

  /* ============ AJUSTES ============ */
  function openSheet(html){ $("#sheet").innerHTML=html; $("#overlay").classList.add('on'); $("#sheet").querySelectorAll('[data-close]').forEach(function(b){b.onclick=closeSheet;}); }
  function closeSheet(){ $("#overlay").classList.remove('on'); $("#sheet").innerHTML=""; }
  $("#overlay").addEventListener('click',function(e){ if(e.target===$("#overlay"))closeSheet(); });
  function openSettings(){ var pr=db.profile||{nick:"",section:""};
    openSheet('<div class="shead"><h2>Settings</h2><button class="close" data-close>✕</button></div>'+
      '<div class="field"><label>Account</label><div style="font-size:16px;font-weight:800">'+esc(pr.nick)+'</div><div class="note" style="margin-top:2px">Your name and PIN identify your account across all your devices.</div></div>'+
      '<div class="field"><label>Section</label><div class="secpick" id="stSec">'+SECTIONS.map(function(s){return '<button data-s="'+s+'" class="'+(pr.section===s?'on':'')+'">'+s+'</button>';}).join('')+'</div></div>'+
      '<button class="btn red block" id="stSave">Save section</button>'+
      '<div style="height:12px"></div>'+
      '<button class="btn ghost block" id="stLogout">Sign out</button>'+
      '<div style="height:8px"></div>'+
      '<button class="btn ghost block" id="stReset" style="color:var(--red)">Reset my progress (level, XP, achievements)</button>'+
      '<p class="note">Install the app: on iPhone, Share → “Add to Home Screen”. On Android, menu → “Install app”.</p>'+
      '<p class="note">Case Math · v1.0 · A student project, unofficial and not affiliated with any institution. Strategies based on “Consulting &amp; DI Fundamentals: Mental Math”.</p>');
    var sec=pr.section;
    $("#sheet").querySelectorAll('#stSec button').forEach(function(b){ b.onclick=function(){ sec=b.dataset.s; $("#sheet").querySelectorAll('#stSec button').forEach(function(x){x.classList.toggle('on',x===b);}); }; });
    $("#stSave").onclick=function(){ db.profile.section=sec||pr.section||SECTIONS[0]; save(); closeSheet(); toast('✅','Section saved',''); render(); };
    $("#stLogout").onclick=function(){ if(!confirm('Sign out on this device? You can sign back in with your name and PIN.'))return; db.auth=null; db.profile=null; save(); closeSheet(); toast('👋','Signed out',''); setView('train'); };
    $("#stReset").onclick=function(){ if(!confirm('Reset ALL your progress (level, XP, achievements, stats)? This cannot be undone.'))return; db.prog={}; db.stats={}; db.challenge={}; normalize(db); save(); closeSheet(); toast('🔄','Progress reset',''); setView('train'); };
  }

  /* ============ ADMIN (solo Pedro Bodega): estadísticas de uso ============ */
  function ensureAdminTab(){
    var bar=document.getElementById('tabbar'); if(!bar) return;
    var has=bar.querySelector('[data-view="admin"]');
    if(isAdmin()){ if(!has){ var b=document.createElement('button'); b.className='t'; b.setAttribute('data-view','admin'); b.innerHTML='<span class="i">📊</span>Admin'; b.onclick=function(){ keydownHandler=null; setView('admin'); }; bar.appendChild(b); } }
    else if(has){ has.remove(); }
  }
  function fetchAllScores(){ if(!sbReady())return Promise.reject(new Error('Supabase not configured'));
    return fetch(CFG.SUPABASE_URL+'/rest/v1/scores?select=nick,section,score,challenge_id,created_at&order=created_at.desc&limit=5000',{headers:sbHeaders()}).then(function(r){ if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); }); }
  function barRows(items, labelFn, valFn){ var max=1; items.forEach(function(x){ var v=valFn(x); if(v>max)max=v; });
    return items.map(function(x){ var v=valFn(x), w=Math.round(v/max*100); return '<div class="pbar-row"><div class="pl">'+labelFn(x)+'</div><div class="pbar-track"><div class="pbar-fill" style="width:'+w+'%"></div></div><div class="pbar-val"><b>'+v+'</b></div></div>'; }).join(''); }
  function dayBars(obj){ var days=Object.keys(obj||{}).sort().slice(-14); if(!days.length)return '<p class="note" style="margin:6px 0 0">No data.</p>';
    return barRows(days,function(d){var dd=d.split("-");return '<span style="font-size:11px">'+(dd[2]+"/"+dd[1])+'</span>';},function(d){return obj[d];}); }
  function renderAdmin(){
    keydownHandler=null;
    app.innerHTML='<div class="sechead"><div><div class="kicker">Admin · usage</div><h2>Stats</h2></div><div class="rule"></div></div>'+
      '<div class="card" id="adUsers"><p class="note" style="margin:0">Loading users…</p></div>'+
      '<div id="adScores"><div class="card"><p class="note" style="margin:0">Loading challenge data…</p></div></div>';
    if(!sbReady()){ $("#adUsers").innerHTML='<p class="note" style="margin:0">Supabase not configured.</p>'; $("#adScores").innerHTML=''; return; }

    // --- usuarios / uso (profiles, vía RPC admin) ---
    sbRpc('mm_admin',{p_nick:db.auth.nick,p_pin:db.auth.pin}).then(function(a){
      if(!a||!a.ok) throw new Error(a&&a.error||'rpc');
      var mins=Math.round((a.total_seconds||0)/60), avgMin= a.total_users? Math.round((a.total_seconds||0)/a.total_users/60) : 0;
      var secList=Object.keys(a.by_section||{}).map(function(s){return {s:s,n:a.by_section[s]};}).sort(function(x,y){return y.n-x.n;});
      $("#adUsers").outerHTML=
        '<div class="hud"><div class="c"><div class="lab">Total users</div><div class="val">'+a.total_users+'</div></div><div class="c"><div class="lab">New today</div><div class="val">'+a.new_today+'</div></div><div class="c"><div class="lab">Active today</div><div class="val">'+a.active_today+'</div></div></div>'+
        '<div class="hud"><div class="c"><div class="lab">Active 7d</div><div class="val">'+a.active_7d+'</div></div><div class="c"><div class="lab">New 7d</div><div class="val">'+a.new_7d+'</div></div><div class="c"><div class="lab">Avg time/user</div><div class="val">'+avgMin+'<small>min</small></div></div></div>'+
        '<div class="card"><span class="kicker">New users per day</span>'+dayBars(a.new_by_day)+'</div>'+
        '<div class="card"><span class="kicker">Active users per day</span>'+dayBars(a.active_by_day)+'</div>'+
        '<div class="card"><span class="kicker">Users by section</span>'+(secList.length?barRows(secList,function(x){return 'Section '+esc(x.s);},function(x){return x.n;}):'<p class="note" style="margin:6px 0 0">No data.</p>')+'</div>'+
        '<div class="card"><span class="kicker">Overall</span><p class="note" style="margin:0">Total problems solved: <b>'+fmt(a.total_solved||0)+'</b> · total practice time: <b>'+fmt(mins)+' min</b> (~'+fmt(Math.round(mins/60))+' h).</p></div>';
    }).catch(function(err){
      $("#adUsers").innerHTML='<b>User stats not available yet.</b><p class="note" style="margin-bottom:0">Run <code>supabase-admin.sql</code> in the Supabase SQL editor to enable total/new/active users and time. ('+esc(err.message||'error')+')</p>';
    });

    // --- retos (scores, legibles con la clave pública) ---
    fetchAllScores().then(function(rows){
      var today=todayISO(), players={}, byDay={}, plays=rows.length, todayPlays=0, scoreSum=0;
      rows.forEach(function(r){ var k=(r.nick||'').trim().toLowerCase();
        if(!players[k]) players[k]={nick:r.nick,section:r.section,best:0};
        if(r.score>players[k].best){ players[k].best=r.score; players[k].section=r.section; }
        var d=r.challenge_id||String(r.created_at||'').slice(0,10); byDay[d]=(byDay[d]||0)+1; if(d===today)todayPlays++; scoreSum+=r.score; });
      var top=Object.keys(players).map(function(k){return players[k];}).sort(function(a,b){return b.best-a.best;}).slice(0,12);
      var topRows=top.map(function(p,i){return '<tr><td class="pos">'+(i+1)+'</td><td>'+esc(p.nick)+'<span class="sec">'+esc(p.section)+'</span></td><td style="text-align:right;font-weight:800">'+fmt(p.best)+'</td></tr>';}).join('');
      $("#adScores").innerHTML=
        '<div class="sechead" style="margin-top:20px"><div><div class="kicker">Daily Challenge</div><h2 style="font-size:20px">Competition</h2></div><div class="rule"></div></div>'+
        '<div class="hud"><div class="c"><div class="lab">Challenge plays</div><div class="val">'+plays+'</div></div><div class="c"><div class="lab">Players</div><div class="val">'+Object.keys(players).length+'</div></div><div class="c"><div class="lab">Plays today</div><div class="val">'+todayPlays+'</div></div></div>'+
        '<div class="card"><span class="kicker">Challenge plays per day</span>'+dayBars(byDay)+'</div>'+
        '<div class="card"><span class="kicker">Top players (best challenge score)</span>'+(topRows?'<table class="lb"><thead><tr><th>#</th><th>Player</th><th style="text-align:right">Best</th></tr></thead><tbody>'+topRows+'</tbody></table>':'<p class="note" style="margin:6px 0 0">No data.</p>')+'<p class="note">Average score across all plays: <b>'+(plays?fmt(Math.round(scoreSum/plays)):0)+'</b>.</p></div>';
    }).catch(function(err){ $("#adScores").innerHTML='<div class="card"><p class="note" style="margin:0">⚠️ '+esc(err.message||'error')+'</p></div>'; });
  }

  /* ============ NAV + arranque ============ */
  var keydownHandler=null;
  document.addEventListener('keydown',function(e){ if(keydownHandler)keydownHandler(e); });
  document.querySelectorAll("nav.tabbar .t").forEach(function(b){ b.onclick=function(){ keydownHandler=null; setView(b.dataset.view); }; });
  $("#gear").onclick=openSettings;
  $("#rankChip").onclick=openRankGuide;

  // service worker (solo hospedada)
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){ navigator.serviceWorker.register('sw.js').catch(function(){}); }

  paintRank(); render();
})();
</script>
